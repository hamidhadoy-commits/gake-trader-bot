name = "gake-trader-bot"
main = "worker.js"
compatibility_date = "2026-09-10"

[[d1_databases]]
binding = "DB"
database_name = "gake-trader-db"
database_id = "f6b4e7b5-1b9e-4e28-a077-83d4cece9c3c"

[triggers]
crons = [ "* * * * *" ]

[observability]
enabled = true
head_sampling_rate = 1

[[queues.producers]]
binding = "PAPER_CRON_QUEUE"
queue = "gake-paper-cron-free"

[[queues.consumers]]
queue = "gake-paper-cron-free"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 0
max_concurrency = 1
